        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#2ecc71", "id": "victim_wallet_1", "label": "victim\n1", "shape": "dot", "size": 25, "title": "Wallet: victim_wallet_1\nRisk Status: LOW RISK (10%)\nFlagged: None"}, {"color": "#e67e22", "id": "burner_wallet_C", "label": "burner\nC", "shape": "dot", "size": 20, "title": "Wallet: burner_wallet_C\nRisk Status: HIGH RISK (60%)\nFlagged: High Transaction Velocity in short lifespan (+30%), Active Fund-Peeling pattern identified (+20%)"}, {"color": "#e67e22", "id": "scammer_wallet_A", "label": "scammer\nA", "shape": "dot", "size": 20, "title": "Wallet: scammer_wallet_A\nRisk Status: HIGH RISK (60%)\nFlagged: High Transaction Velocity in short lifespan (+30%), Active Fund-Peeling pattern identified (+20%)"}, {"color": "#e74c3c", "id": "burner_wallet_B", "label": "burner\nB", "shape": "dot", "size": 20, "title": "Wallet: burner_wallet_B\nRisk Status: CRITICAL RISK (100%)\nFlagged: High Transaction Velocity in short lifespan (+30%), Direct/Indirect Mixer Protocol connection (+40%), Active Fund-Peeling pattern identified (+20%)"}, {"color": "#9b59b6", "id": "Binance_Deposit", "label": "Binance\nExchange", "shape": "diamond", "size": 32, "title": "Wallet: Binance_Deposit\nRisk Status: LOW RISK (10%)\nFlagged: None"}]);

                  nodeColors = {};

                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {

    },
    "edges": {

            "inherit": true
        },

            "type": "dynamic"
        }
    },
    "interaction": {

        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {

        "stabilization": {

            "fit": true,

};
